<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนเกษตรคุณไพบูลย์ - จำหน่ายพันธุ์ไม้คุณภาพ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-green-50 text-gray-800">

    <!-- ส่วนหัวเว็บไซต์ (Header) พร้อมปุ่มตะกร้าสินค้า -->
    <header class="bg-green-700 text-white shadow-md py-4 px-6 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">🌿 สวนเกษตรคุณไพบูลย์</h1>
            <p class="text-xs text-green-100">จำหน่ายพันธุ์ไม้และผลผลิตคุณภาพดี</p>
        </div>
        <!-- ปุ่มเปิดตะกร้าสินค้า -->
        <button onclick="toggleCartModal()" class="bg-white text-green-800 px-4 py-2 rounded-full font-semibold shadow hover:bg-green-100 transition flex items-center gap-2">
            🛒 ตะกร้าสินค้า <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
    </header>

    <!-- ส่วนแสดงรายการสินค้า (Product Grid) -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-semibold mb-6 text-green-800 border-b-2 border-green-200 pb-2">📦 รายการพันธุ์ไม้ทั้งหมด</h2>
        
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="text-gray-500 col-span-full text-center py-10">กำลังโหลดข้อมูลสินค้าจากระบบ...</p>
        </div>
    </main>

    <!-- Modal ตะกร้าสินค้าและฟอร์มสั่งซื้อ -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- หัวข้อตะกร้า -->
            <div class="bg-green-700 text-white p-4 flex justify-between items-center">
                <h3 class="text-lg font-bold">🛒 ตะกร้าสินค้าของคุณ</h3>
                <button onclick="toggleCartModal()" class="text-white text-xl font-bold hover:text-green-200">&times;</button>
            </div>
            
            <!-- รายการในตะกร้า -->
            <div id="cart-items-container" class="p-4 overflow-y-auto flex-1 divide-y divide-gray-100">
                <p class="text-gray-500 text-center py-8">ยังไม่มีสินค้าในตะกร้า</p>
            </div>

            <!-- สรุปยอดและฟอร์มกรอกข้อมูล -->
            <div class="p-4 bg-gray-50 border-t">
                <div class="flex justify-between text-lg font-bold mb-3">
                    <span>รวมทั้งหมด:</span>
                    <span id="cart-total" class="text-orange-600">0 บาท</span>
                </div>

                <!-- ฟอร์มรับข้อมูลลูกค้า -->
                <div class="space-y-3 mb-4">
                    <input type="text" id="cust-name" placeholder="ชื่อ-นามสกุล ผู้รับ" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-green-600">
                    <input type="tel" id="cust-phone" placeholder="เบอร์โทรศัพท์ติดต่อ" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-green-600">
                    <textarea id="cust-address" placeholder="ที่อยู่สำหรับจัดส่งสินค้า" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-green-600"></textarea>
                </div>

                <button onclick="checkoutToLine()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow transition text-center block">
                    📲 ยืนยันการสั่งซื้อ (ส่งเข้าร้าน)
                </button>
            </div>
        </div>
    </div>

    <!-- ส่วนท้ายเว็บไซต์ -->
    <footer class="bg-green-900 text-green-200 text-center py-6 mt-12">
        <p>ติดต่อสอบถามเพิ่มเติม | สวนตั้งอยู่ที่ อ.บ่อทอง จ.ชลบุรี</p>
        <p class="text-sm mt-1">&copy; 2026 Paiboon Garden. All rights reserved.</p>
    </footer>

    <!-- Supabase Client & ระบบตะกร้า -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://siiiifesdjuunwmwozfb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaWlpZmVzZGp1dW53bXdvemZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MTM5NDAsImV4cCI6MjEwMjk4OTk0MH0.yJqzmYEPc8uFQ9NIZxk__BKB5pX7Pg9rCotC-1oWW4k'; 
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let cart = []; // เก็บรายการสินค้าในตะกร้า

        async function loadProducts() {
            const container = document.getElementById('product-list');
            const { data, error } = await supabaseClient
                .from('product_kasat')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500 col-span-full text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-full text-center">ยังไม่มีรายการสินค้าในระบบ</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300 flex flex-col justify-between';
                
                card.innerHTML = `
                    <div>
                        <img src="${product.image_url || 'https://via.placeholder.com/400x300?text=No+Image'}" alt="${product.product_name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-xl font-bold text-green-900">${product.product_name}</h3>
                            <p class="text-lg font-semibold text-orange-600 mt-2">${product.price} บาท</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick='addToCart(${JSON.stringify(product)})' class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition flex items-center justify-center gap-2">
                            🛒 เพิ่มลงตะกร้า
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            
            // เอฟเฟกต์แจ้งเตือนเล็กๆ
            alert(`เพิ่ม "${product.product_name}" ลงตะกร้าแล้วครับ`);
        }

        function updateCartUI() {
            const countSpan = document.getElementById('cart-count');
            const container = document.getElementById('cart-items-container');
            const totalSpan = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            countSpan.textContent = totalCount;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-8">ยังไม่มีสินค้าในตะกร้า</p>`;
                totalSpan.textContent = '0 บาท';
                return;
            }

            container.innerHTML = '';
            let totalPrice = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                const div = document.createElement('div');
                div.className = 'py-3 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-gray-800">${item.product_name}</h4>
                        <p class="text-sm text-gray-500">${item.price} บาท x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-orange-600">${itemTotal} บาท</span>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold text-sm bg-red-50 px-2 py-1 rounded">ลบ</button>
                    </div>
                `;
                container.appendChild(div);
            });

            totalSpan.textContent = totalPrice + ' บาท';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkoutToLine() {
            if (cart.length === 0) {
                alert('กรุณาเลือกสินค้าใส่ตะกร้าก่อนครับ');
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('กรุณากรอก ชื่อ เบอร์โทร และที่อยู่จัดส่งให้ครบถ้วนครับ');
                return;
            }

            let orderText = `🌿 *[ สั่งซื้อสินค้าจากเว็บไซต์สวนเกษตร ]* 🌿\n`;
            orderText += `----------------------------------\n`;
            
            let totalPrice = 0;
            cart.forEach((item, i) => {
                const subTotal = item.price * item.quantity;
                totalPrice += subTotal;
                orderText += `${i+1}. ${item.product_name} x ${item.quantity} = ${subTotal} บาท\n`;
            });

            orderText += `----------------------------------\n`;
            orderText += `💰 *ยอดรวมทั้งสิ้น:* ${totalPrice} บาท\n\n`;
            orderText += `👤 *ผู้สั่งซื้อ:* ${name}\n`;
            orderText += `📞 *เบอร์โทร:* ${phone}\n`;
            orderText += `📍 *ที่อยู่จัดส่ง:* ${address}\n`;

            // ใส่ LINE ID ของคุณไพบูลย์ตรงนี้ (แทนคำว่า YOUR_LINE_ID หรือใส่ลิงก์เบอร์โทร/ไลน์)
            const lineId = 'YOUR_LINE_ID'; 
            const encodedMessage = encodeURIComponent(orderText);
            
            // เปิดหน้า LINE เพื่อส่งข้อมูล
            window.open(`https://line.me/ti/p/~${lineId}?text=${encodedMessage}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
